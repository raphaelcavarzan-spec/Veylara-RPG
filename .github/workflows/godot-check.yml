name: Godot project checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Import and smoke-test project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Verify Godot version
        run: godot --version

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Smoke-test main scene
        run: godot --headless --path . --quit-after 10

      - name: Check Isildur sprite regions and direction visibility
        run: godot --headless --path . --script res://tests/test_isildur_sprites.gd

      - name: Render Isildur preview
        run: godot --headless --path . --script res://tests/render_isildur_preview.gd

      - name: Upload rendered preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isildur-visual-preview
          path: isildur-preview.png
          if-no-files-found: warn
          retention-days: 7
